# ─────────────────────────────────────────────────────────────────────────────
# Nginx Configuration — Mango King Ratnagiri
# Domain  : www.mangokingratnagiri.com / mangokingratnagiri.com
# Frontend: SvelteKit (Node adapter) on port 3000
# Backend : Express API on port 4000
# SSL     : Let's Encrypt via Certbot
# ─────────────────────────────────────────────────────────────────────────────

limit_req_zone $binary_remote_addr zone=api:10m     rate=60r/m;
limit_req_zone $binary_remote_addr zone=auth:10m    rate=10r/m;
limit_req_zone $binary_remote_addr zone=general:10m rate=100r/m;

upstream frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name mangokingratnagiri.com www.mangokingratnagiri.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.mangokingratnagiri.com$request_uri;
    }
}

# ── non-www → www redirect ───────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mangokingratnagiri.com;

    ssl_certificate     /etc/letsencrypt/live/mangokingratnagiri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mangokingratnagiri.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.mangokingratnagiri.com$request_uri;
}

# ── Main HTTPS server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mangokingratnagiri.com;

    ssl_certificate     /etc/letsencrypt/live/mangokingratnagiri.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mangokingratnagiri.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_stapling              on;
    ssl_stapling_verify       on;
    resolver                  8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout          5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"                                   always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header X-XSS-Protection         "1; mode=block"                                always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin"              always;
    add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()"     always;

    access_log /var/log/nginx/mangoking_access.log;
    error_log  /var/log/nginx/mangoking_error.log warn;

    client_max_body_size 15M;

    # ── API → Express backend ─────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # Auth — strict rate limit
    location /api/auth/ {
        limit_req zone=auth burst=5 nodelay;
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Razorpay webhook — raw body, no rate limit
    location = /api/payments/webhook {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 30s;
    }

    # Shiprocket webhook
    location = /api/payments/shiprocket-webhook {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Uploaded files — served directly ─────────────────────────────────────
    location /uploads/ {
        alias   /var/www/mangoking/server/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        location ~* \.(php|pl|py|sh)$ { deny all; }
    }

    # ── SvelteKit static assets ───────────────────────────────────────────────
    location /_app/ {
        alias      /var/www/mangoking/client/build/_app/;
        expires    1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
        access_log  off;
    }

    location = /logo.png {
        alias      /var/www/mangoking/client/build/logo.png;
        expires    30d;
        access_log off;
    }

    location = /favicon.ico {
        alias      /var/www/mangoking/client/build/favicon.ico;
        expires    7d;
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        alias      /var/www/mangoking/client/build/robots.txt;
        access_log off;
        log_not_found off;
    }

    # ── Everything else → SvelteKit frontend ─────────────────────────────────
    location / {
        limit_req zone=general burst=50 nodelay;
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        gzip            on;
        gzip_vary       on;
        gzip_min_length 1024;
        gzip_comp_level 6;
        gzip_types      text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    }

    # Block common attacks
    location ~* \.(env|git|htaccess|htpasswd)$   { deny all; return 404; }
    location ~* /(wp-admin|phpmyadmin|adminer)    { deny all; return 404; }
}
